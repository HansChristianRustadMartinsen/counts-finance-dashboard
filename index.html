/* Counts v0.3 refinements: layout order, semantic colors and transaction detail. */
:root{--red:#e87881;--amber:#dcb16b;--blue:#8599b0}
.brand{margin-bottom:51px}.brand strong{font-size:24px;letter-spacing:-1.4px}.brand-period{color:var(--teal)!important;font-size:24px!important;letter-spacing:0!important}.brand span:not(.brand-period){font-size:10px;line-height:1.3;letter-spacing:.1px;max-width:160px}
.visual-grid.breakdown-grid{grid-template-columns:1fr 1fr;gap:16px;margin-bottom:19px}
.category-visual{gap:19px;align-items:center}.category-visual .donut{width:172px;height:172px}.cat-list{gap:12px;max-height:240px;overflow:auto;padding-right:3px}
.cat-row strong{white-space:nowrap}.cat-row strong small{font-weight:500;color:var(--muted)}.cat-row span{color:#d4e0e5}.donut::after{inset:29px}
.stats-section{display:grid;gap:13px;margin-bottom:19px}.stats-section>.kpi-total>.kpi{border:0;background:transparent;padding:19px 23px}.kpi-total{padding:0;border-color:#356660;background:linear-gradient(110deg,#142e34,#172a35)}.kpi-total .kpi-value{font-size:35px}.kpis.kpis-three{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:0;gap:13px}
.kpis-three .kpi{padding:18px 22px}.kpis-three .kpi-value{font-size:25px}.accent-blue{color:#a9b7c8}
.trend-card{margin-bottom:19px}.bar.essential{background:#54d2b4}.bar.discretionary{background:#e87881}.bar.unassigned{background:#8293a2}
.chart-bars{gap:10px}.bar-wrap{gap:6px}.bar{width:25px;max-width:30%}.bar-labels{gap:10px;flex-wrap:nowrap}.bar-labels span{white-space:nowrap}
.cat-tag.colored{color:var(--category-color);border:1px solid color-mix(in srgb,var(--category-color),transparent 62%);background:color-mix(in srgb,var(--category-color),transparent 91%);gap:3px;font-weight:700}
.cat-tag.unknown{color:#aab7c4;background:#283541}.cat-tag.transfer{color:#8fa8ce}.tx-row{cursor:pointer}.tx-row:focus-visible{outline:2px solid var(--teal);outline-offset:-3px;background:#1b303d}.tx-row[aria-expanded="true"]{background:#1b303d}.tx-details td{background:#15242f;padding:17px 20px 20px}.details-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.details-grid div{min-width:0;overflow-wrap:anywhere}.details-grid span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}.details-grid strong{font-size:12px;font-weight:650;color:#dbe9ed}.expand-icon{font-size:20px;padding:0 6px;vertical-align:middle}
@media(max-width:1250px){.visual-grid.breakdown-grid{grid-template-columns:1fr 1fr}.category-visual{flex-wrap:wrap;justify-content:center}.cat-list{width:100%}}
@media(max-width:900px){.visual-grid.breakdown-grid{grid-template-columns:1fr}.category-visual{flex-wrap:nowrap}.details-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.app-shell{grid-template-columns:minmax(0,1fr)}.main,.sidebar,.page-root,.visual-grid.breakdown-grid,.kpis.kpis-three{min-width:0;max-width:100%}.visual-grid.breakdown-grid{grid-template-columns:minmax(0,1fr)}.cat-list{min-width:0}.category-visual{max-width:100%}}
@media(max-width:650px){.kpis.kpis-three{grid-template-columns:1fr}.category-visual{flex-wrap:wrap}.details-grid{grid-template-columns:repeat(2,1fr)}.kpi-total .kpi-value{font-size:29px}.chart-bars{gap:3px}.bar-labels{gap:3px}.bar{width:13px;max-width:28%}.cat-row strong small{display:none}}
/* v0.3: more legible category palette, guided date pickers, adaptive donut callouts. */
.period-picker{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.period-picker label{display:grid;gap:5px;color:#aebfcc;font-size:10px;font-weight:750;letter-spacing:.55px;text-transform:uppercase}
.period-picker select{min-width:99px;max-width:140px;font-size:12px;padding:9px 11px}
.period-picker select:disabled{opacity:.43;cursor:not-allowed}
.period-chevron{align-self:flex-end;color:#72909d;font-size:20px;margin-bottom:7px}
.connector-chart{display:block;width:100%;height:auto;max-width:100%;margin:-6px auto -5px;overflow:visible}
.category-visual-wrapper{min-width:0}
.category-visual-wrapper .chart-fallback{display:none}
@media(max-width:1199px){.connector-chart{display:none}.category-visual-wrapper .chart-fallback{display:flex}}
@media(max-width:650px){.period-picker{justify-content:flex-start;gap:5px}.period-picker select{min-width:85px;max-width:108px;padding:8px 7px}.period-chevron{display:none}.period-picker label{font-size:9px}.page-head{flex-wrap:wrap}}

/* Counts v0.4: matching legends for both counterclockwise donuts; adaptive trends. */
.category-visual-wrapper .category-visual{display:flex!important}
.trend-head-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trend-toggle{display:flex;gap:4px;padding:3px;background:#0d1b25;border:1px solid var(--line);border-radius:9px}
.trend-toggle .btn{border:0;background:transparent;color:#9badb9;min-width:47px;padding:6px 11px}
.trend-toggle .btn.active{background:#255048;color:#b8ffee}
.trend-line-wrap{width:100%;overflow:hidden}
.trend-line{display:block;width:100%;height:auto;max-width:100%}
.trend-line-labels{display:flex;gap:0;padding:3px 0 0}
.trend-line-labels span{flex:1;text-align:center;color:#8ba1ad;font-size:11px;white-space:nowrap}
.trend-note{font-size:11px;color:#78909f;margin:13px 0 0}
.trend-card .legend{margin-top:18px;flex-wrap:wrap}
@media(max-width:800px){.trend-head-actions{gap:6px}.trend-head-actions .chip{display:none}.trend-card .card-head{flex-wrap:wrap}.trend-line-labels span{font-size:10px}.trend-card .legend{gap:11px}}
@media(max-width:440px){.trend-line-labels span{font-size:9px}.chart-bars .bar{max-width:32%}.trend-card .card-sub{font-size:10px}}
.language-picker .select{padding:7px 9px;min-height:34px;font-size:12px;font-weight:800;letter-spacing:.4px;border-color:#45616c;background:#1b2c37}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){.top-actions{gap:7px}.language-picker .select{padding:6px 5px}.topbar{gap:8px}}
/* Clear, per-file batch import review */
.batch-file{border:1px solid #345364;background:#12232f;border-radius:13px;padding:18px;margin:13px 0;min-width:0}
.batch-head{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.batch-head strong{font-size:15px;overflow-wrap:anywhere}.batch-account{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start}
.batch-account .form-row{min-width:0}.batch-preview{display:flex;flex-wrap:wrap;gap:9px;margin:9px 0 14px}
.batch-metric{background:#1b3240;border:1px solid #345261;border-radius:8px;padding:9px 12px;min-width:122px;flex:1}
.batch-metric span{display:block;color:#a7bdc7;font-size:11px}.batch-metric strong{font-size:16px}
.batch-file details{margin-top:12px}.batch-file summary{cursor:pointer;color:#85dccc;font-weight:750;padding:8px 0}
.batch-note{color:#a1b5bf;font-size:12px;margin:10px 0}.batch-warning{color:#ffd697;border:1px solid #826239;border-radius:8px;background:#332b22;padding:10px;font-size:12px;margin:10px 0}
.batch-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:18px}
@media(max-width:700px){.batch-account{grid-template-columns:1fr}.batch-file{padding:13px}}

  [/(hafslund|elvia|fortum|norgesenergi|tibber|str[oø]mregning|fjordkraft)/i,'electricity'],

  [/(apotek|lege|tannlege|sykehus|legevakt|helsenorge)/i,'health'],

];
const toNorm = text => String(text ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ø/gi,'o').replace(/æ/gi,'ae').replace(/[^a-zA-Z0-9]+/g,' ').trim().toLowerCase();
function merchantKey(desc){
  let s=toNorm(desc).replace(/\b(?:kortkjop|varekjop|betaling|reservert|visa|mastercard|vipps|transaksjon|fra|til|dato|terminal)\b/g,' ').replace(/\s+/g,' ').trim();
  const known=[['rema 1000','rema 1000'],['kiwi','kiwi'],['meny','meny'],['bunnpris','bunnpris'],['coop extra','coop extra'],['extra','extra'],['netflix','netflix'],['spotify','spotify'],['hafslund','hafslund'],['elvia','elvia'],['steam','steam'],['apotek','apotek'],['vinmonopolet','vinmonopolet'],['wolt','wolt']];
  for(const [needle,key] of known){if(new RegExp('(^| )'+needle.replace(/ /g,'\\s+')+'( |$)').test(s))return key;}
  return s.replace(/\b\d{2,}\b/g,' ').replace(/\s+/g,' ').trim().slice(0,68) || 'unknown';
}
function matchingRule(description,rules=[]){
  const key=merchantKey(description),raw=toNorm(description);
  return [...rules].sort((a,b)=>toNorm(b.merchant).length-toNorm(a.merchant).length).find(r=>{
    const pattern=toNorm(r.merchant);
    return pattern.length>=3&&(key===pattern||(` ${raw} `).includes(` ${pattern} `)||(` ${key} `).includes(` ${pattern} `));
  });
}
function categorize(description,rules=[]){
  return matchingRule(description,rules)?.category||AUTO_PATTERNS.find(([regex])=>regex.test(String(description||'')))?.[1]||'';
}
function effectiveGroup(t,rules=[],categories=[]){
  if(t.groupOverride==='essential'||t.groupOverride==='discretionary')return t.groupOverride;
  if(t.category)return categories.find(c=>c.id===t.category)?.group||'';
  const rule=matchingRule(t.description,rules);
  if(rule&&(rule.group==='essential'||rule.group==='discretionary'))return rule.group;
  const category=effectiveCategory(t,rules);
  return categories.find(c=>c.id===category)?.group||'';
}
function parseCSV(text, delimiter){
  const src=String(text).replace(/^\uFEFF/,'');
  const d=delimiter||detectDelimiter(src);
  let rows=[],row=[],field='',quoted=false;
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(ch==='"'){
      if(quoted&&src[i+1]==='"'){field+='"';i++;} else quoted=!quoted;
    }else if(ch===d&&!quoted){row.push(field);field='';}
    else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&src[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field='';}
    else field+=ch;
  }
  row.push(field);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
function detectDelimiter(text){
  const firstLines=String(text).split(/\r?\n/).slice(0,12).filter(Boolean);
  let score={';':0,',':0,'\t':0};
  for(const line of firstLines){let quoted=false; for(let i=0;i<line.length;i++){if(line[i]==='"'){if(quoted&&line[i+1]==='"'){i++;continue;}quoted=!quoted;}else if(!quoted&&score[line[i]]!==undefined)score[line[i]]++;}}
  return Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];
}
function detectHeader(rows){
  for(let i=0;i<Math.min(20,rows.length);i++){
    const ns=rows[i].map(toNorm);
    const hasDate=ns.some(s=>/dato|date|bokfor/.test(s));
    const hasAmount=ns.some(s=>/belop|amount|debet|kredit|ut av|inn pa|sum/.test(s));
    if(hasDate&&hasAmount) return i;
  }
  return 0;
}
function guessMapping(headers){
  const hs=headers.map(toNorm);
  const get=(terms,exclude=[])=>{
    for(const term of terms){const i=hs.findIndex(s=>s===term);if(i>=0)return i;}
    for(const term of terms){const i=hs.findIndex(s=>s.includes(term)&&!exclude.some(e=>s.includes(e)));if(i>=0)return i;}
    return -1;
  };
  return {
    date:get(['bokforingsdato','transaksjonsdato','dato','date','valutadato']),
    desc:get(['beskrivelse','transaksjonstekst','tekst','melding','mottaker','brukersted','description','navn']),
    amount:get(['belop','belop nok','amount','sum','transaksjonsbelop'],['saldo','balanse','inn','ut','debet','kredit']),
    debit:get(['ut','ut av konto','belop ut','utgaende belop','utgaende','utbetaling','debet','uttak','withdrawal','out']),
    credit:get(['inn','inn pa konto','belop inn','inngaende belop','inngaende','innbetaling','kredit','innskudd','deposit','in']),
    time:get(['klokkeslett','tidspunkt','tid','time','transaction time']),
    reference:get(['referanse','reference','kid','melding','message','detaljer'],['beskrivelse']),
    balance:get(['saldo etter','saldo','balance']),
    toAccount:get(['til konto','mottakerkonto','to account','recipient account']),
    fromAccount:get(['fra konto','avsenderkonto','from account','sender account']),
  };
}
function parseAmount(input){
  if(input===undefined||input===null)return null;
  let s=String(input).trim().replace(/[−–—]/g,'-').replace(/[\s\u00a0\u202f]|kr|nok/gi,'');
  if(!s||s==='-')return null;
  let neg=/^\(.*\)$/.test(s)||s.includes('-');
  s=s.replace(/[()\-+]/g,'');
  const comma=s.lastIndexOf(','),dot=s.lastIndexOf('.');
  if(comma!==-1&&dot!==-1){if(comma>dot)s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,'');}
  else if(comma!==-1){
    const decimals=s.length-comma-1;
    s=decimals===3&&s.indexOf(',')===comma?s.replace(/,/g,''):s.replace(',','.');
  }else if(dot!==-1&&s.length-dot-1===3&&s.indexOf('.')===dot){s=s.replace('.','');}
  const n=Number(s);return Number.isFinite(n)?Math.round((neg?-n:n)*100):null;
}
function parseTime(value){
  const match=String(value||'').match(/(?:^|[T\s])(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(!match)return '';
  const hh=Number(match[1]), mm=Number(match[2]), ss=match[3]!==undefined?Number(match[3]):null;
  if(hh>23||mm>59||(ss!==null&&ss>59))return '';
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+(ss===null?'':':'+String(ss).padStart(2,'0'));
}
function parseDate(value){
  const s=String(value||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/))){let year=Number(m[3]);if(year<100)year+=year>=70?1900:2000;const day=Number(m[1]),month=Number(m[2]);if(month<1||month>12||day<1||day>31)return '';return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;}
  return '';
}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
function accountFingerprint(value){const digits=String(value||'').replace(/\D/g,'');return digits.length>=10&&digits.length<=34?hash(digits):'';}
function inferOwnAccountKey(records){
  const counts=new Map();let observed=0;
  for(const t of records){
    const key=t.amount<0?t.fromKey:t.amount>0?t.toKey:'';
    if(key){observed++;counts.set(key,(counts.get(key)||0)+1);}
  }
  const sorted=[...counts].sort((a,b)=>b[1]-a[1]);
  if(!sorted.length)return '';
  const [key,count]=sorted[0];
  return count>=3&&count/Math.max(1,observed)>=.8?key:'';
}
function knownBankKey(account){
  if(account.bankKey)return account.bankKey;
  return inferOwnAccountKey(state.transactions.filter(t=>t.accountId===account.id));
}
function csvToTransactions(rows,mapping,accountId){
  const records=[];const errors=[];const duplicateCounter={};
  for(let i=0;i<rows.length;i++){
    const row=rows[i];
    if(row.every(x=>!String(x).trim()))continue;
    const date=parseDate(row[mapping.date]);
    const description=String(row[mapping.desc]||'').trim();
    let amount=mapping.amount>=0?parseAmount(row[mapping.amount]):null;
    if(mapping.amount<0){const out=parseAmount(row[mapping.debit]),inside=parseAmount(row[mapping.credit]);amount=(inside===null&&out===null)?null:(Math.abs(inside||0)-Math.abs(out||0));}
    if(!date||amount===null){errors.push(i+1);continue;}
    const time=parseTime((mapping.time>=0?row[mapping.time]:'')||row[mapping.date]);
    const reference=mapping.reference>=0&&mapping.reference!==mapping.desc?String(row[mapping.reference]||'').trim().slice(0,180):'';
    const balance=mapping.balance>=0?parseAmount(row[mapping.balance]):null;
    const fromKey=Number.isInteger(mapping.fromAccount)&&mapping.fromAccount>=0?accountFingerprint(row[mapping.fromAccount]):'';
    const toKey=Number.isInteger(mapping.toAccount)&&mapping.toAccount>=0?accountFingerprint(row[mapping.toAccount]):'';
    const basis=`${accountId}|${date}|${amount}|${toNorm(description)}`;
    duplicateCounter[basis]=(duplicateCounter[basis]||0)+1;
    records.push({id:'tx_'+hash(basis)+'_'+duplicateCounter[basis],accountId,date,time,description:description||'Unknown transaction',amount,reference,balance,fromKey,toKey,category:'',groupOverride:null,transferOverride:null,created:Date.now()});
  }

}
function dateDistance(a,b){return Math.abs((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/86400000);}
function transferMatches(transactions){
  // Best evidence: the bank identifies BOTH the same source and destination
  // accounts on the opposite-signed rows. We store short fingerprints rather
  // than raw account numbers, only for in-browser transfer reconciliation.
  // Fallback: matching signed amounts across two accounts with transfer wording.
  const candidates=transactions.filter(t=>t.transferOverride!==false);
  const used=new Set(),matched=new Set();
  for(const a of candidates.filter(t=>t.amount<0).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))){
    if(used.has(a.id))continue;
    const possible=candidates.filter(b=>b.amount===-a.amount&&b.accountId!==a.accountId&&!used.has(b.id)&&dateDistance(a.date,b.date)<=3);
    const linked=possible.filter(b=>a.fromKey&&a.toKey&&b.fromKey===a.fromKey&&b.toKey===a.toKey);
    const options=linked.length?linked:possible;
    if(options.length!==1)continue;
    const b=options[0],provenByAccounts=linked.length===1;
    const hint=/(overf[oø]r|transfer|mellom egne|fra konto|til konto|fast overf|innbetaling|avsetning)/i;
    if(!provenByAccounts&&!hint.test(a.description)&&!hint.test(b.description))continue;
    if(!provenByAccounts){
      // Do not auto-match ambiguous text-only pairs.
      const competing=candidates.filter(x=>x.id!==a.id&&x.accountId===a.accountId&&x.amount===a.amount&&dateDistance(x.date,b.date)<=3&&!used.has(x.id));
      if(competing.length)continue;
    }
    matched.add(a.id);matched.add(b.id);used.add(a.id);used.add(b.id);
  }
  return matched;
}
function isTransfer(t,matched){return t.transferOverride===true||(t.transferOverride!==false&&matched.has(t.id));}
function effectiveCategory(t,rules=[]){return t.category||categorize(t.description,rules);}
function inPeriod(date,period){
  if(period==='all'||!period)return true;
  if(period.startsWith('m:'))return date.slice(0,7)===period.slice(2);
  if(period.startsWith('y:'))return date.slice(0,4)===period.slice(2);
  if(period.startsWith('q:')){
    const [year,q]=period.slice(2).split('-Q');
    return date.slice(0,4)===year && Math.ceil(Number(date.slice(5,7))/3)===Number(q);
  }
  // Compatibility with old YYYY-MM callers.
  return date.slice(0,7)===period;
}
function derive(transactions,accounts,categories,rules,perspective='household',selectedAccount='personal',period='all'){
  const matches=transferMatches(transactions);
  const accountById=Object.fromEntries(accounts.map(a=>[a.id,a]));
  const visible=transactions.filter(t=>inPeriod(t.date,period))
    .filter(t=>perspective!=='account'||t.accountId===selectedAccount)
    .map(t=>{
      const account=accountById[t.accountId]||{role:'personal',share:100,name:'Unknown account'};
      const fraction=perspective==='share'?Number(account.share)/100:1;
      const transfer=isTransfer(t,matches);
      const category=effectiveCategory(t,rules);
      const group=effectiveGroup(t,rules,categories);
      const expense=!transfer&&(t.amount<0||(t.amount>0&&Boolean(category)));
      const expenseValue=expense?-t.amount*fraction:0;
      return {...t,account,category,group,transfer,expense,expenseValue,fraction};
    }).sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id));

  return {visible,spending,essential,discretionary,uncategorized,income,transfers,categoryTotals};
}

function translateMessage(value){

  if(english==='● Uncategorized')return '● Ukategorisert';
  if(english==='↔ Internal transfer')return '↔ Intern overføring';
  if(english.startsWith('Essential, non-essential and uncategorized · '))return 'Nødvendig, ikke nødvendig og ukategorisert · '+translateMessage(english.split(' · ').slice(1).join(' · '));

  if(english==='or')return 'eller';

  if(english.startsWith('Showing only transactions from '))return english.replace('Showing only transactions from ','Viser kun transaksjoner fra ').replace('. Internal transfers are excluded from spending, but remain visible in the ledger.','. Interne overføringer utelates fra utgifter, men vises fortsatt i transaksjonsoversikten.');
  if(english==='Shows all imported account spending once. Matched internal transfers are excluded; shared expenses are shown at 100%.')return 'Alle importerte kontoutgifter telles én gang. Matchede interne overføringer utelates, og fellesutgifter vises med 100 %.';

  if(english.startsWith('Automatic ('))return english.replace('Automatic (','Automatisk (').replace('currently treated as an internal transfer','regnes nå som intern overføring').replace('no confirmed match','ingen bekreftet match');

  if(english.startsWith('Could not restore: '))return english.replace('Could not restore: ','Kunne ikke gjenopprette: ');
  if(english.startsWith('Import preview failed: '))return english.replace('Import preview failed: ','Kunne ikke forhåndsvise import: ');
  if(english.startsWith('CSV file exceeds the 12 MB prototype limit.'))return 'CSV-filen er større enn grensen på 12 MB. Eksporter en kortere periode.';
  if(english.startsWith('Show details for '))return english.replace('Show details for ','Vis detaljer for ');

function applyTranslations(scope=document.body){
  document.documentElement.lang=language==='no'?'nb':'en';
  const tree=document.createTreeWalker(scope,NodeFilter.SHOW_TEXT);
  while(tree.nextNode()){
    const node=tree.currentNode,tag=node.parentElement?.tagName;
    if(!node.nodeValue.trim()||tag==='SCRIPT'||tag==='STYLE')continue;
    if(!originalText.has(node))originalText.set(node,node.nodeValue);
    const source=originalText.get(node);
    // Preserve whitespace from the original HTML/template.
    const trimmed=source.trim();
    if(!trimmed)continue;
    const start=source.indexOf(trimmed),end=start+trimmed.length;
    node.nodeValue=source.slice(0,start)+translateMessage(trimmed)+source.slice(end);
  }
  const elements=[scope,...scope.querySelectorAll('*')].filter?.(Boolean) || [scope,...scope.querySelectorAll('*')];
  for(const el of elements){
    if(!el.getAttribute)continue;
    let refs=originalAttributes.get(el);
    if(!refs){refs={};originalAttributes.set(el,refs);}
    for(const attr of ['placeholder','aria-label','title']){
      if(!el.hasAttribute(attr))continue;
      if(!(attr in refs))refs[attr]=el.getAttribute(attr);
      el.setAttribute(attr,translateMessage(refs[attr]));
    }
  }
  const picker=document.getElementById('language-switch');
  if(picker)picker.value=language;
}

}

function ring(values,total,caption){
  const active=values.filter(x=>x.value>0),overall=Math.max(1,total);
  // CSS conic gradients advance clockwise from 12 o'clock. Reversing the
  // gradient stops gives a clockwise-independent visual reading: the first
  // (largest) segment begins at 12 o'clock and progresses counterclockwise.
  let cursor=0;
  const gradient=[...active].reverse().map(x=>{
    const from=cursor;cursor+=x.value/overall*100;
    return `${x.color} ${from.toFixed(3)}% ${cursor.toFixed(3)}%`;
  }).join(',');
  return `<div class="donut" role="img" aria-label="${h(caption)}: ${h(active.map(x=>x.name+': '+fmt(x.value)).join('; '))}" style="background:${gradient?`conic-gradient(${gradient})`:'#30414b'}"><div class="donut-center"><strong>${fmt(total)}</strong><span>${h(caption)}</span></div></div>`;
}

  const detailed=[...state.categories.map(c=>({name:c.name,value:data.categoryTotals[c.id]||0,color:c.color})),groups[2]];

function trendBuckets(period,existingMonths=[]){
  // Always include four consecutive complete calendar periods ending with the
  // chosen month, quarter or year, even when no imported transactions exist.
  if(period.startsWith('m:')){
    const [y,m]=period.slice(2).split('-').map(Number);
    return Array.from({length:4},(_,i)=>{
      const d=new Date(Date.UTC(y,m-1-3+i,1));
      const mkey=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
      return {key:'m:'+mkey,label:monthFmt(mkey),period:'month'};
    });
  }
  if(period.startsWith('q:')){
    const match=period.match(/^q:(\d{4})-Q([1-4])$/);
    if(match){
      const endIndex=Number(match[1])*4+Number(match[2])-1;
      return Array.from({length:4},(_,i)=>{
        const idx=endIndex-3+i,year=Math.floor(idx/4),quarter=idx%4+1;
        return {key:`q:${year}-Q${quarter}`,label:`Q${quarter} ${year}`,period:'quarter'};
      });
    }
  }
  if(period.startsWith('y:')){
    const y=Number(period.slice(2));
    return Array.from({length:4},(_,i)=>({key:`y:${y-3+i}`,label:String(y-3+i),period:'year'}));
  }
  // All time: one data point per recorded year, chronologically, filling gaps.
  const ys=existingMonths.map(m=>Number(m.slice(0,4))).filter(Number.isFinite);
  if(!ys.length)return [];
  const min=Math.min(...ys),max=Math.max(...ys);
  return Array.from({length:max-min+1},(_,i)=>({key:`y:${min+i}`,label:String(min+i),period:'year'}));
}

function smoothPath(points){
  // Monotone Hermite cubic interpolation provides a smooth visual trend while
  // limiting overshoot between the actual period totals.
  if(points.length===0)return '';
  if(points.length===1)return `M${points[0].x} ${points[0].y}`;
  const slopes=points.slice(1).map((p,i)=>(p.y-points[i].y)/(p.x-points[i].x));
  const tangents=points.map((_,i)=>i===0?slopes[0]:i===points.length-1?slopes.at(-1):(slopes[i-1]*slopes[i]<=0?0:2*slopes[i-1]*slopes[i]/(slopes[i-1]+slopes[i])));
  let path=`M${points[0].x.toFixed(2)} ${points[0].y.toFixed(2)}`;
  for(let i=0;i<points.length-1;i++){
    const a=points[i],b=points[i+1],dx=(b.x-a.x)/3;
    path+=` C${(a.x+dx).toFixed(2)} ${(a.y+tangents[i]*dx).toFixed(2)} ${(b.x-dx).toFixed(2)} ${(b.y-tangents[i+1]*dx).toFixed(2)} ${b.x.toFixed(2)} ${b.y.toFixed(2)}`;
  }
  return path;
}
function trendLineChart(data){
  const W=940,H=248,padX=85,padTop=13,padBottom=15;
  const chartH=H-padTop-padBottom;
  const max=Math.max(1,...data.map(d=>Math.max(0,d.essential+d.discretionary+d.uncategorized)));
  const x=i=>padX+(W-2*padX)*(data.length===1?0.5:i/(data.length-1));
  const y=v=>padTop+chartH*(1-Math.max(0,v)/max);
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${padX}" x2="${W-padX}" y1="${(padTop+chartH*f).toFixed(2)}" y2="${(padTop+chartH*f).toFixed(2)}" stroke="#293945" stroke-width="1"/><text x="${padX-11}" y="${(padTop+chartH*f+4).toFixed(2)}" text-anchor="end" font-size="12" fill="#9ab1bd">${h(axisLabel((1-f)*max))}</text>`).join('');
  const lines=TREND_SERIES.map(series=>{
    const pts=data.map((d,i)=>({x:x(i),y:y(d[series.key]),amount:d[series.key],label:d.label}));
    const path=smoothPath(pts);
    const nodes=pts.map(v=>`<circle cx="${v.x.toFixed(2)}" cy="${v.y.toFixed(2)}" r="5" fill="${series.color}" stroke="#121e29" stroke-width="2"><title>${h(v.label)} · ${h(series.label)}: ${h(fmt(v.amount))}</title></circle>`).join('');
    return `<path d="${path}" fill="none" stroke="${series.color}" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><g>${nodes}</g>`;
  }).join('');
  const desc=TREND_SERIES.map(s=>s.label+': '+data.map(d=>d.label+' '+fmt(d[s.key])).join(', ')).join('; ');
  return `<div class="trend-line-wrap"><svg class="trend-line" viewBox="0 0 ${W} ${H}" role="img" aria-label="Smoothed spending trends; exact recorded totals shown at points. ${h(desc)}" xmlns="http://www.w3.org/2000/svg">${grid}${lines}</svg></div><div class="trend-line-labels">${data.map(d=>`<span>${h(d.label)}</span>`).join('')}</div>`;
}
function trendChart(){

function renderDashboard(){

  return `${intro("How ya goin\' count",'Your money, your categories, and a clearer picture of how it all adds up.',monthSelect())}${controls()}<p class="view-note">${note()}</p>

function mapUsable(m){return m.date>=0&&m.desc>=0&&(m.amount>=0||m.debit>=0||m.credit>=0);}
function proposeAccount(filename,accounts=state.accounts){
  const name=filename.replace(/\.[^.]+$/,'').replace(/[ _]+/g,' ').trim();
  const clean=toNorm(name);
  let type='checking',role='personal',share=100,preferredId=null;
  if(/trekkonto|bolig.*lan|mortgage|l[aå]nekonto|l[aå]netrekk/.test(clean)){type='mortgage';role='shared';share=50;preferredId='loan';}
  else if(/felles|joint|shared|husstand/.test(clean)){type='household';role='shared';share=50;preferredId='shared';}
  else if(/bruks|brukskonto|loennskonto|lonnskonto|personal|privat|current/.test(clean)){type='checking';role='personal';share=100;preferredId='personal';}
  else if(/spar|saving|reserve|buffer/.test(clean)){type='savings';}
  else if(/kreditt|credit|mastercard|visa/.test(clean)){type='credit';}
  else if(/invest|aksje|fond|portfolio/.test(clean)){type='investment';}
  const identical=accounts.find(a=>toNorm(a.name)===clean);
  const known=preferredId?accounts.find(a=>a.id===preferredId):null;
  return {selected:(identical||known)?.id||'new',name:name.slice(0,52)||'New account',type,role,share};
}

  return {valid:records.length,invalid:errors.length,out:records.filter(x=>x.amount<0).length,in:records.filter(x=>x.amount>0).length,
    expense:-records.filter(x=>x.amount<0).reduce((a,x)=>a+x.amount,0),income:records.filter(x=>x.amount>0).reduce((a,x)=>a+x.amount,0)};
}

async function loadCSVs(files){
  if(!files?.length)return;
  if(files.length>30){toast('Please select at most 30 CSV files per batch.','error');return;}
  const pending=[];const problems=[];
  for(const file of files){
    if(file.size>12_000_000){problems.push(file.name+': CSV exceeds 12 MB');continue;}
    try{
      const bytes=await file.arrayBuffer();let text;
      try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch{text=new TextDecoder('windows-1252').decode(bytes);}
      const parsed=parseCSV(text);if(parsed.length<2)throw Error('No transaction rows detected');
      const idx=detectHeader(parsed);const headers=parsed[idx].map(x=>String(x).trim()),rows=parsed.slice(idx+1).filter(row=>row.some(x=>x.trim()));
      const proposed=proposeAccount(file.name),mapping=guessMapping(headers);
      const identity=mapUsable(mapping)?inferOwnAccountKey(csvToTransactions(rows,mapping,'preview').records):'';
      const matched=identity?state.accounts.find(a=>knownBankKey(a)===identity):null;
      if(matched)proposed.selected=matched.id;
      pending.push({filename:file.name,headers,rows,mapping,identity,identityMatch:!!matched,...proposed});
    }catch(e){problems.push(file.name+': '+e.message);}
  }
  if(!pending.length){toast('No files could be read. '+problems.join('; '),'error');return;}
  pendingImport=pending;render();
  if(problems.length)toast('Some files were skipped: '+problems.join('; '),'error');
  else toast(`${pending.length} file(s) ready for review. Confirm the account assignment before importing.`);
}
function finishImport(){
  if(!pendingImport?.length)return;
  // Validate every file before writing any transactions.
  const plans=[],reserved=[];
  for(let i=0;i<pendingImport.length;i++){
    const p=pendingImport[i];
    if(!mapUsable(p.mapping)){toast(`File ${i+1}: choose date, description and amount columns.`, 'error');return;}
    let accountId=p.selected;
    if(accountId==='new'){
      const name=(document.getElementById('new-name-'+i)?.value||p.name).trim().slice(0,52);
      const type=document.getElementById('new-type-'+i)?.value||p.type;
      const role=document.getElementById('new-role-'+i)?.value||p.role;
      const share=Number(document.getElementById('new-share-'+i)?.value??p.share);
      if(!name||!Number.isFinite(share)||share<0||share>100){toast(`File ${i+1}: enter a valid account name and share.`, 'error');return;}
      const prev=[...state.accounts,...reserved].find(a=>toNorm(a.name)===toNorm(name));
      if(prev)accountId=prev.id;
      else {accountId='account_'+hash(toNorm(name))+'_'+i;reserved.push({id:accountId,name,type,role,share,bankKey:''});}
    }
    if(accountId!=='new'&&!state.accounts.some(a=>a.id===accountId)&&!reserved.some(a=>a.id===accountId)){
      toast(`File ${i+1}: choose an account.`, 'error');return;
    }
    const parsed=csvToTransactions(p.rows,p.mapping,accountId);
    if(!parsed.records.length){toast(`File ${i+1}: no valid transactions. Check the column mapping.`, 'error');return;}
    const identity=inferOwnAccountKey(parsed.records);
    const chosen=[...state.accounts,...reserved].find(a=>a.id===accountId);
    const previouslyKnown=chosen&&knownBankKey(chosen);
    if(identity&&previouslyKnown&&identity!==previouslyKnown){toast(`File ${i+1}: the bank account identifier does not match the selected account. Check the account assignment.`, 'error');return;}
    const existingAccount=identity?[...state.accounts,...reserved].find(a=>a.id!==accountId&&knownBankKey(a)===identity):null;
    if(existingAccount){toast(`File ${i+1}: this statement matches ${existingAccount.name}. Select that account instead to avoid duplicates.`, 'error');return;}
    plans.push({filename:p.filename,accountId,identity,...parsed});
  }
  if(state.demo&&!confirm(translateMessage('This workspace currently holds example transactions. Replace all sample transactions with your imported bank data?')))return;
  const proposedState={...state,accounts:[...state.accounts,...reserved],transactions:state.demo?[]:state.transactions.map(t=>({...t})),rules:state.demo?[]:[...state.rules],demo:false};
  const existing=new Map(proposedState.transactions.map(x=>[x.id,x]));let count=0,duplicates=0,invalid=0;
  for(const p of plans){const a=proposedState.accounts.find(a=>a.id===p.accountId);if(a&&p.identity&&!a.bankKey)a.bankKey=p.identity;}
  for(const p of plans){
    invalid+=p.errors.length;
    for(const t of p.records){
      const earlier=existing.get(t.id);
      if(earlier){
        // Previous Counts versions did not retain bank transfer endpoint fingerprints.
        // Fill only missing metadata, preserving user-corrected categories and transfer flags.
        for(const key of ['fromKey','toKey','time','reference','balance']){
          if((earlier[key]===undefined||earlier[key]===null||earlier[key]==='')&&t[key]!==undefined&&t[key]!==null&&t[key]!=='')earlier[key]=t[key];
        }
        duplicates++;continue;
      }
      existing.set(t.id,t);proposedState.transactions.push(t);count++;
    }
  }
  // Commit only when this exact result can be persisted; do not discard an old working state.
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(proposedState));}
  catch(e){toast('Browser storage is full. Nothing was imported; please export a backup or import fewer months.','error');return;}
  state=proposedState;pendingImport=null;chosenMonth='m:'+latestMonth();accountView=state.accounts[0]?.id||'personal';navigate('dashboard');
  toast(`Imported ${count} transactions from ${plans.length} file(s). Skipped ${duplicates} duplicates and ${invalid} invalid rows.`);
}
function updateState(){save();render();}
// Event delegation ensures all re-rendered controls stay interactive.
document.addEventListener('click',event=>{
  const btn=event.target.closest('button,[data-nav]');  if(!btn){const tr=event.target.closest('[data-row-id]');if(tr)toggleDetails(tr.dataset.rowId);return;}
  if(btn.dataset.page){navigate(btn.dataset.page);return;}
  if(btn.dataset.pageLink){navigate(btn.dataset.pageLink);return;}
  if(btn.dataset.nav){event.preventDefault();navigate(btn.dataset.nav);return;}
  if(btn.id==='top-import'){navigate('import');return;}
  if(btn.dataset.perspective){perspective=btn.dataset.perspective;render();return;}
  if(btn.dataset.trendMode){trendMode=btn.dataset.trendMode;render();return;}
  if(btn.dataset.edit){editTransaction(btn.dataset.edit);return;}
  if(btn.dataset.expand){toggleDetails(btn.dataset.expand);return;}
  if(btn.dataset.editAccount){editAccount(btn.dataset.editAccount);return;}
  if(btn.id==='add-account'){editAccount(null);return;}
  if(btn.id==='close-modal'||btn.id==='cancel-modal'){closeModal();return;}
  if(btn.id==='confirm-import'){finishImport();return;}
  if(btn.id==='cancel-import'){pendingImport=null;render();return;}
  if(btn.dataset.deleteRule){if(confirm(translateMessage(`Remove custom categorization rule for ${btn.dataset.deleteRule}?`))){state.rules=state.rules.filter(r=>r.merchant!==btn.dataset.deleteRule);updateState();}return;}
  if(btn.dataset.deleteCategory){const id=btn.dataset.deleteCategory,used=state.rules.some(x=>x.category===id)||state.transactions.some(x=>x.category===id);if(used){toast('This category is used by transactions or rules. Reassign them before deleting.','error');return;}if(confirm(translateMessage('Remove this custom category?'))){state.categories=state.categories.filter(x=>x.id!==id);updateState();}return;}
  if(btn.dataset.removeAccount){const a=state.accounts.find(x=>x.id===btn.dataset.removeAccount);if(state.accounts.length<=1){toast('At least one account is required.','error');return;}if(confirm(translateMessage(`Delete ${a.name} and ALL its imported transactions? This cannot be undone without a backup.`))){state.transactions=state.transactions.filter(x=>x.accountId!==a.id);state.accounts=state.accounts.filter(x=>x.id!==a.id);if(accountView===a.id)accountView=state.accounts[0].id;if(importAccount===a.id)importAccount=state.accounts[0].id;closeModal();updateState();}return;}
  if(btn.id==='download-sample'){download('sample_sparebank_statement.csv','Dato;Beskrivelse;Rentedato;Inn;Ut;Til konto;Fra konto\r\n25.10.2026;KIWI DEMO STORE;;;-179,98;;\r\n24.10.2026;Demo salary;;31250,00;;;\r\n23.10.2026;Demo electricity;;;-922,40;;\r\n','text/csv;charset=utf-8');return;}
  if(btn.id==='export-backup'){download('counts_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded. Store it securely.');return;}
  if(btn.id==='clear-transactions'){if(confirm(translateMessage('Delete ALL transaction data from this browser? Account definitions and categorization rules will remain. Export a backup first if needed.'))){state.transactions=[];state.demo=false;chosenMonth='all';updateState();toast('All transactions cleared.');}return;}
  if(btn.id==='load-demo'){if(confirm(translateMessage('Replace ALL local data with fictional example transactions? Existing data and rules will be lost unless backed up.'))){state=demoState();chosenMonth='m:'+currentMonth();importAccount='personal';updateState();toast('Example transactions loaded.');}return;}
});
modalLayer.addEventListener('click',e=>{if(e.target===modalLayer)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-row-id]')){e.preventDefault();toggleDetails(e.target.dataset.rowId);}});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='language-switch'){setLanguage(el.value);return;}
  if(el.id==='period-year'){setPeriod(el.value);render();}
  else if(el.id==='period-quarter'){setPeriod(document.getElementById('period-year').value,el.value);render();}
  else if(el.id==='period-month'){setPeriod(document.getElementById('period-year').value,document.getElementById('period-quarter').value,el.value);render();}
  else if(el.id==='rule-group'||el.id==='tx-group'){
    const select=document.getElementById(el.id==='rule-group'?'rule-category':'tx-category');
    if(el.value!==''){select.disabled=false;if(!select.value)select.value=state.categories[0]?.id||'';}else select.disabled=true;applyTranslations(select);
  }
  else if(el.id==='account-filter'){accountView=el.value;render();}
  else if(el.id==='type-filter'){typeFilter=el.value;render();}
  else if(el.id==='category-filter'){categoryFilter=el.value;render();}
  else if(el.id==='batch-account-select'){/* unused generic id */}
  else if(el.classList.contains('batch-account-select')){const p=pendingImport?.[Number(el.dataset.fileIndex)];if(p){p.selected=el.value;render();}}
  else if(el.classList.contains('batch-map-field')){const p=pendingImport?.[Number(el.dataset.fileIndex)];if(p){p.mapping[el.dataset.field]=Number(el.value);render();}}
  else if(el.classList.contains('batch-new-type')){const p=pendingImport?.[Number(el.dataset.fileIndex)];if(p)p.type=el.value;}
  else if(el.classList.contains('batch-new-role')){const p=pendingImport?.[Number(el.dataset.fileIndex)];if(p){p.role=el.value;p.share=el.value==='shared'?50:100;const share=document.getElementById('new-share-'+el.dataset.fileIndex);if(share)share.value=p.share;}}
  else if(el.classList.contains('batch-new-share')){const p=pendingImport?.[Number(el.dataset.fileIndex)];if(p)p.share=Number(el.value);}
  else if(el.id==='csv-file'){await loadCSVs(Array.from(el.files||[]));}
  else if(el.id==='restore-backup'){
    const f=el.files?.[0];if(!f)return;
    try{const obj=JSON.parse(await f.text());if(!validateState(obj))throw Error('Not a valid Counts v1 backup.');if(!confirm(translateMessage('Replace all locally saved accounts, transactions and rules with this backup?')))return;state=obj;accountView=state.accounts[0]?.id||'personal';importAccount=accountView;chosenMonth='m:'+latestMonth();pendingImport=null;updateState();toast('Backup successfully restored.');}catch(err){toast('Could not restore: '+err.message,'error');}
  }
});
document.addEventListener('input',e=>{if(e.target.classList.contains('batch-new-name')){const p=pendingImport?.[Number(e.target.dataset.fileIndex)];if(p)p.name=e.target.value;return;}if(e.target.id==='search-transactions'){const el=e.target;search=el.value;const pos=el.selectionStart;render();const next=document.getElementById('search-transactions');next?.focus();try{next?.setSelectionRange(pos,pos);}catch{}}});
document.addEventListener('submit',e=>{
  if(e.target.id==='edit-tx-form'){e.preventDefault();const f=e.target,t=state.transactions.find(x=>x.id===f.dataset.id);if(!t)return;
    const fd=new FormData(f),cat=String(fd.get('category')||''),transfer=fd.get('transfer');
    t.category=cat;t.groupOverride=cat?(String(fd.get('group'))||null):null;t.transferOverride=transfer==='yes'?true:transfer==='no'?false:null;
    if(fd.has('remember')&&cat){const merchant=merchantKey(t.description);state.rules=state.rules.filter(x=>x.merchant!==merchant);state.rules.push({merchant,category:cat,group:t.groupOverride});t.category='';t.groupOverride=null;}
    closeModal();updateState();toast('Transaction updated and saved locally.');return;
  }
  if(e.target.id==='account-form'){e.preventDefault();const f=e.target,fd=new FormData(f),id=f.dataset.id,name=String(fd.get('name')||'').trim(),share=Number(fd.get('share')),role=String(fd.get('role')),type=String(fd.get('type'));
    const rawNumber=String(fd.get('bankNumber')||'').trim(),digits=rawNumber.replace(/\D/g,''),bankKey=digits.length===11?accountFingerprint(digits):'';
    if(rawNumber&&!bankKey)return toast('Enter a valid bank account number.','error');
    if(bankKey&&state.accounts.some(a=>a.id!==id&&knownBankKey(a)===bankKey))return toast('That bank account number is already linked to another account.','error');
    if(!name||!Number.isFinite(share)||share<0||share>100)return toast('Enter a valid name and share between 0 and 100.','error');
    if(id){const a=state.accounts.find(x=>x.id===id);Object.assign(a,{name,role,share,type});if(bankKey)a.bankKey=bankKey;}
    else{const newId='account_'+Date.now().toString(36);state.accounts.push({id:newId,name,role,share,type,bankKey});}
    closeModal();updateState();toast('Account saved.');return;
  }
  if(e.target.id==='new-rule-form'){e.preventDefault();const fd=new FormData(e.target),merchant=toNorm(fd.get('merchant')),category=String(fd.get('category')),group=String(fd.get('group'));if(merchant.length<3||!category||!state.categories.some(c=>c.id===category))return toast('Enter merchant text and choose a valid category.','error');state.rules=state.rules.filter(x=>x.merchant!==merchant);state.rules.push({merchant,category,group});updateState();toast('Merchant rule saved.');return;}
  if(e.target.id==='new-category-form'){e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim(),group=String(fd.get('group'));if(!name||!['essential','discretionary'].includes(group))return;
    const id='custom_'+Date.now().toString(36);const used=state.categories.filter(c=>c.id.startsWith('custom_')).length;const palette=['#e969c2','#35d2cd','#f2b952','#9384ee','#f28c6a','#96d45e','#60aaf2','#d7a4e4'];state.categories.push({id,name,group,color:palette[used%palette.length]});updateState();toast('Category added.');return;}
});

render();

</script>
